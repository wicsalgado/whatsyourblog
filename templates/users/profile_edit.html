{% extends 'base.html' %}

{% block title %}Editar perfil{% endblock %}

{% block content %}
    <div class="form-card form-card--wide">
        <h1>Editar perfil</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Salvar</button>
        </form>
    </div>
{% endblock %}
